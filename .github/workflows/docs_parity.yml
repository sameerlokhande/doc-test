name: "Documentation Parity"

on:
  push:
    branches:
      - update-discount-rate
      - main
    paths:
      - "**.py"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "**.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Initialize local inference runtime (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Stop the auto-started systemd service bound only to localhost
          sudo systemctl stop ollama || true
          
          # Start Ollama bound to all interfaces and allow external bridge origins
          OLLAMA_HOST=0.0.0.0:11434 OLLAMA_ORIGINS="*" ollama serve &
          
          # Wait for the HTTP daemon to become healthy
          until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do
            echo "Waiting for Ollama daemon to start..."
            sleep 1
          done
          
          ollama pull qwen2.5-coder:1.5b

      - name: Self-Healing Technical Documentation
        uses: sameerlokhande/self-healing-documentations@v1.0.2
        env:
          OLLAMA_HOST: "http://172.17.0.1:11434"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ollama_host: "http://172.17.0.1:11434"
          confidence_threshold: "0.75"

      - name: Commit and push synchronized documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain "*.md") ]]; then
            git add *.md
            git commit -m "docs(parity): synchronize documentation with code changes [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "Documentation is synchronized; no updates required."
          fi