name: "Documentation Parity"

on:
  push:
    paths:
      - "**.py"
      - "**.md"
  pull_request:
    paths:
      - "**.py"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-Healing Technical Documentation
        uses: sameerlokhande/self-healing-documentations@v1.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}